<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Outfit", sans-serif;
      background:
        radial-gradient(circle at 20% 30%, #003f5c 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, #001f3f 0%, transparent 35%),
        #02060d;
      color: #fff;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(rgba(0,191,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,191,255,.04) 1px, transparent 1px);

      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    /* Glow */
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: #00bfff;
      filter: blur(180px);
      opacity: .12;
      border-radius: 50%;
      animation: moveGlow 8s ease-in-out infinite alternate;
    }

    @keyframes moveGlow {
      from {
        transform: translate(-180px, -100px);
      }

      to {
        transform: translate(200px, 120px);
      }
    }

    .container {
      position: relative;
      z-index: 10;

      width: min(90%, 850px);
      padding: 70px 40px;

      text-align: center;

      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.12);

      border-radius: 28px;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 16px;
      margin-bottom: 25px;

      border: 1px solid rgba(0,191,255,.3);
      border-radius: 50px;

      background: rgba(0,191,255,.08);

      color: #67d9ff;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #00bfff;
      border-radius: 50%;

      box-shadow: 0 0 12px #00bfff;

      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      50% {
        opacity: .3;
      }
    }

    h1 {
      font-size: clamp(55px, 10vw, 105px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -4px;

      background: linear-gradient(
        135deg,
        #ffffff 10%,
        #8de6ff 45%,
        #00bfff 75%,
        #ffffff 100%
      );

      background-size: 200% auto;

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation: shine 5s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    .subtitle {
      max-width: 550px;
      margin: 25px auto 35px;

      color: #9ba8b5;
      font-size: 18px;
      font-weight: 300;
      line-height: 1.7;
    }

    .line {
      width: 100px;
      height: 2px;

      margin: 0 auto 30px;

      background: linear-gradient(
        90deg,
        transparent,
        #00bfff,
        transparent
      );

      box-shadow: 0 0 15px #00bfff;
    }

    .status {
      font-size: 14px;
      color: #6d7c8a;
      letter-spacing: 1px;
    }

    .status span {
      color: #00bfff;
    }

    /* Floating particles */
    .particle {
      position: absolute;

      width: 4px;
      height: 4px;

      background: #00bfff;
      border-radius: 50%;

      box-shadow: 0 0 10px #00bfff;

      animation: float 7s infinite ease-in-out;
    }

    .p1 {
      left: 10%;
      top: 20%;
    }

    .p2 {
      right: 12%;
      top: 25%;
      animation-delay: 2s;
    }

    .p3 {
      left: 20%;
      bottom: 15%;
      animation-delay: 4s;
    }

    .p4 {
      right: 20%;
      bottom: 12%;
      animation-delay: 1s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
        opacity: .3;
      }

      50% {
        transform: translateY(-35px);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {

      .container {
        padding: 55px 20px;
        border-radius: 22px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>

  <main class="container">

    <div class="badge">
      <div class="dot"></div>
      Something new is coming
    </div>

    <h1>
      COMING<br>SOON
    </h1>

    <p class="subtitle">
      We're working behind the scenes to create something
      special. A new experience is on its way.
    </p>

    <div class="line"></div>

    <p class="status">
      STATUS — <span>BUILDING SOMETHING AMAZING</span>
    </p>

  </main>

</body>
</html>
